repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0  # Use the latest release from https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      # Run the linter with auto-fix
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format