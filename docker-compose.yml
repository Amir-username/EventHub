services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: eventhub-api
   
    ports:
      - "8000:8000"
    env_file:
      - /.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/eventhub
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app                # project root → /app
      - /app/.venv 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventhub-network
    restart: unless-stopped
    # Override with 'dev' for local development (auto-reload enabled)
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:17-alpine
    container_name: eventhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - eventhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventhub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eventhub-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - eventhub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eventhub-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eventhub.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - eventhub-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgadmin_data: 

networks:
  eventhub-network:
    driver: bridge